<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca NoSQL · Firestore</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>📚 Biblioteca NoSQL</h1>
    <p>App web con <b>Cloud Firestore</b> (base de datos NoSQL orientada a documentos) desplegada en <b>Firebase Hosting</b> con GitHub Actions.</p>
  </header>

  <main>
    <section class="card">
      <h2>Agregar libro</h2>
      <form id="form-libro" novalidate>
        <input name="titulo" placeholder="Título" maxlength="120" required />
        <input name="autor" placeholder="Autor" maxlength="80" required />
        <select name="genero" required><option value="">Género…</option></select>
        <input name="anio" type="number" placeholder="Año" min="1000" required />
        <button type="submit">Guardar</button>
      </form>
      <p id="errores" role="alert"></p>
    </section>

    <section class="card">
      <div class="barra">
        <h2>Libros <small id="contador"></small></h2>
        <select id="filtro-genero"><option value="">Todos los géneros</option></select>
      </div>
      <ul id="lista"><li class="vacio">Cargando…</li></ul>
    </section>
  </main>

  <footer>Proyecto grupal · Base de Datos II · UPT</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>

name: CI/CD · Despliegue en Firebase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Despliegue (Hosting + reglas e índices de Firestore)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    steps:
      - name: Verificar configuración del repositorio
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          falta=0
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions → Secrets)."
            falta=1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Falta la variable FIREBASE_PROJECT_ID (Settings → Secrets and variables → Actions → Variables)."
            falta=1
          fi
          exit $falta
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools
      - name: Credenciales de la cuenta de servicio
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Desplegar con Firebase CLI
        run: firebase deploy --only hosting,firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

name: CI/CD · Despliegue en Firebase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Despliegue (Hosting + reglas e índices de Firestore)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    steps:
      - name: Verificar configuración del repositorio
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          falta=0
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions → Secrets)."
            falta=1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Falta la variable FIREBASE_PROJECT_ID (Settings → Secrets and variables → Actions → Variables)."
            falta=1
          fi
          exit $falta
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools
      - name: Credenciales de la cuenta de servicio
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # Valida el JSON sin mostrar la clave privada
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::FIREBASE_SERVICE_ACCOUNT no es un JSON válido (" + e.message + "). Pega el contenido completo del archivo .json."); process.exit(1); }
            const faltan = ["type", "project_id", "private_key", "client_email"].filter(k => !j[k]);
            if (j.type !== "service_account" || faltan.length) { console.log("::error::El JSON no es una clave de cuenta de servicio. Faltan: " + faltan.join(", ")); process.exit(1); }
            console.log("Cuenta de servicio:", j.client_email, "· proyecto:", j.project_id);
          ' "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Desplegar con Firebase CLI
        run: |
          set -o pipefail
          if ! firebase deploy --only hosting,firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force 2>&1 | tee deploy.log; then
            # Muestra el error de Firebase como anotación visible en el resumen de la ejecución
            msg=$(grep -iE "error|denied|not found|enable|permission" deploy.log | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=firebase deploy::${msg:-Revisa el log del paso}"
            exit 1
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
